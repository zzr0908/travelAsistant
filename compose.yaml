name: travel-assistant
services:
  app:
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-4317}:4317"
    environment:
      TRAVEL_SETUP_CONFIG_DIR: /data/private
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CARD_API_KEY: ${CARD_API_KEY:-}
      CARD_MODEL: ${CARD_MODEL:-glm-5.3-flash}
    volumes:
      - app-data:/data
      - service-config:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks: [services]
  agent:
    build:
      context: .
      target: agent
    init: true
    restart: unless-stopped
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_INTERNAL_URL: http://app:4319
      TRAVEL_SERVICE_TOKEN_FILE: /config/service-token
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      BROWSER_ENABLED: ${BROWSER_ENABLED:-1}
    volumes:
      - agent-data:/agent-data
      - service-config:/config:ro
    networks: [services]
volumes:
  app-data:
  agent-data:
  service-config:
networks:
  services:
