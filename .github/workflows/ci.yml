name: Regression
on:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/bootstrap.mjs
      - run: npm run check
      - run: npm run check:package
      - run: npm test
      - run: npm run test:services
      - run: node scripts/verify-runtime.mjs
      - if: runner.os == 'macOS'
        run: TRAVEL_INSTALL_DIR="$RUNNER_TEMP/travel-install" node scripts/install-local.mjs --no-start
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up -d --build --wait
      - run: curl --fail http://127.0.0.1:4317/api/health
      - if: always()
        run: docker compose logs && docker compose down -v
